name: Release

# Manual, like the spec libraries: releasing is a decision, not a consequence of pushing. What is
# not a decision is the number, which comes from the conventional commits since the last tag.
#
# The first tag is made by hand. This works out every one after it, and does nothing at all when no
# commit since the last release warrants one.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Work out the version and report it, but do not tag or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-all

      # There is no test step. This module's tests need a Magento framework install, and therefore
      # repo.magento.com credentials, so they run in the project through d/check. A lint is what can
      # be done without the framework, and it still catches a release nobody can load.
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # default_bump: false is what makes a dispatch with only docs or chore commits a no-op rather
      # than a pointless patch release. It leaves new_tag empty, which the next step checks.
      - name: Work out the version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          default_bump: false
          fetch_all_tags: true
          create_annotated_tag: true
          dry_run: ${{ inputs.dry_run }}

      - name: Release
        if: ${{ steps.tag.outputs.new_tag && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.tag.outputs.new_tag }}' \
            --title '${{ steps.tag.outputs.new_tag }}' \
            --notes '${{ steps.tag.outputs.changelog }}'

      - name: Summary
        if: ${{ always() }}
        run: |
          NEW='${{ steps.tag.outputs.new_tag }}'

          if [ -z "$NEW" ]; then
            echo '### Nothing to release' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No commit since `${{ steps.tag.outputs.previous_tag }}` was a feat, fix or breaking change.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### $NEW"
            echo ''
            echo "A \`${{ steps.tag.outputs.release_type }}\` release after \`${{ steps.tag.outputs.previous_tag }}\`."
            echo "${{ inputs.dry_run && 'Dry run: nothing was tagged.' || '' }}"
          } >> "$GITHUB_STEP_SUMMARY"
